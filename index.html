<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PES CHAMPIONS LEAGUE 2026 MOBILE</title>
    <style>
        body {
            /* الخلفية الكحلية/الزرقاء من الصورة */
            background-color: #0409a3;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        .header-title {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .matches-container {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* كروت المباريات بألوان المجسمات في الصورة */
        .match-card {
            background-color: #020557;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-top: 2px solid rgba(255,255,255,0.1);
        }

        /* تمييز الحدود بألوان eFootball المستخرجة من الصورة */
        .match-1 { border-right: 6px solid #e5121b; } /* أحمر */
        .match-2 { border-right: 6px solid #e2e800; } /* أصفر */
        .match-3 { border-right: 6px solid #00d2eb; } /* سماوي */
        .match-4 { border-right: 6px solid #ff7b00; } /* برتقالي */
        .match-5 { border-right: 6px solid #00c836; } /* أخضر */

        .score {
            background-color: #ffffff;
            color: #0409a3;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 800;
        }

        .footer {
            margin-top: 40px;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 15px;
            font-size: 14px;
            color: #d1d5db;
        }

        .team-tag {
            color: #e2e800; /* الأصفر الزاهي */
            font-weight: bold;
            font-size: 16px;
            margin-top: 5px;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <div class="header-title">
        PES CHAMPIONS LEAGUE 2026 MOBILE
    </div>

    <div class="matches-container">
        <div class="match-card match-1">
            <span>الفريق الأول</span>
            <span class="score">0 - 0</span>
            <span>الفريق الثاني</span>
        </div>
        
        <div class="match-card match-2">
            <span>الفريق الثالث</span>
            <span class="score">0 - 0</span>
            <span>الفريق الرابع</span>
        </div>
        
        <div class="match-card match-3">
            <span>الفريق الخامس</span>
            <span class="score">0 - 0</span>
            <span>الفريق السادس</span>
        </div>
        
        <div class="match-card match-4">
            <span>الفريق السابع</span>
            <span class="score">0 - 0</span>
            <span>الفريق الثامن</span>
        </div>
        
        <div class="match-card match-5">
            <span>الفريق التاسع</span>
            <span class="score">0 - 0</span>
            <span>الفريق العاشر</span>
        </div>
    </div>

    <div class="footer">
        <p>صمم بواسطة muhammed mhaboub alryh</p>
        <p class="team-tag">TARGARYEN FC</p>
    </div>

</body>
</html>
